services:
  webhook:
    image: python:3.11-slim
    container_name: bnk2026-webhook
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - /var/log:/var/log:rw
      - /home/dinitech/bnk2026:/home/dinitech/bnk2026:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      WEBHOOK_PORT: 9002
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-changez-ce-secret}
      PROJECT_DIR: /home/dinitech/bnk2026
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-dinitech2025}
    ports:
      - "9002:9002"
    # Créer le fichier de log et démarrer le serveur (Python déjà disponible)
    command: >
      sh -c "
        touch /var/log/bnk2026-webhook.log && 
        chmod 666 /var/log/bnk2026-webhook.log && 
        python3 /app/scripts/webhook-server.py
      "
    networks:
      - bnk2026

networks:
  bnk2026:
    external: true
