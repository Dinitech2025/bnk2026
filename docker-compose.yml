services:

  # ─── Base de données PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bnk2026-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - bnk2026

  # ─── Stockage d'images MinIO ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: bnk2026-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web MinIO
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - bnk2026

  # ─── Création automatique du bucket MinIO ────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: bnk2026-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
        mc mb --ignore-existing local/bnk2026;
        mc anonymous set public local/bnk2026;
        exit 0;
      "
    networks:
      - bnk2026

  # ─── Application Next.js ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bnk2026-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://${RASPBERRY_IP}:9000
      NEXT_TELEMETRY_DISABLED: 1
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: bnk2026
      MINIO_REGION: us-east-1
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      - db
      - minio
    networks:
      - bnk2026

volumes:
  postgres_data:
  minio_data:

networks:
  bnk2026:
    driver: bridge
