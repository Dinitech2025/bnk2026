services:

  # ─── Base de données PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bnk2026-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - bnk2026

  # ─── Stockage d'images MinIO (utilise le MinIO existant de Coolify) ─────
  # MinIO tourne déjà : minio-dk4o0sog0ssco4884g0w4ko8
  # Accès : http://100.70.249.11:9000 (API) et :9001 (console)
  # Credentials : dinitech / HKQV3U3CNkqxJcDyJ

  # ─── Application Next.js ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bnk2026-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      MINIO_ENDPOINT: http://minio-dk4o0sog0ssco4884g0w4ko8:9000
      MINIO_PUBLIC_URL: http://${RASPBERRY_IP}:9000
      NEXT_TELEMETRY_DISABLED: 1
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: bnk2026
      MINIO_REGION: us-east-1
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      - db
    networks:
      - bnk2026
      - coolify  # Pour accéder au MinIO existant

volumes:
  postgres_data:

networks:
  bnk2026:
    driver: bridge
  coolify:
    external: true
