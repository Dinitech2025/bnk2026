name: Notify Raspberry Pi

on:
  push:
    branches:
      - main
      - sandbox

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notifier le Raspberry Pi
        # Le Raspberry Pi doit exposer un webhook (ex: avec webhook ou Portainer)
        # Sinon, supprimer ce step et faire un git pull + docker compose up manuellement
        run: |
          echo "Push sur ${{ github.ref_name }} — mettre à jour le Raspberry Pi manuellement :"
          echo "  ssh pi@RASPBERRY_IP"
          echo "  cd bnk2026 && git pull && docker compose up -d --build"
